name: Frontend CI & GHCR

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/print-template-designer-web

jobs:
  quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Bash and Compose deployment files
        shell: bash
        run: |
          bash -n deploy.sh
          docker compose --env-file .env.example config --quiet

      - name: Validate PowerShell deployment script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './deploy.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }

      - name: Typecheck and build frontend dependencies
        run: |
          pnpm --filter @ptd/core typecheck
          pnpm --filter @ptd/core build
          pnpm --filter @ptd/components typecheck
          pnpm --filter @ptd/components build
          pnpm --filter @ptd/react-designer typecheck
          pnpm --filter @ptd/react-designer build
          pnpm --filter web typecheck

      - name: Test frontend packages
        run: |
          pnpm --filter @ptd/core test
          pnpm --filter @ptd/components test
          pnpm --filter @ptd/react-designer test

      - name: Lint frontend
        run: pnpm lint:frontend

      - name: Build web
        run: pnpm --filter web build

  server-quality:
    name: Server quality (PostgreSQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ptd
          POSTGRES_PASSWORD: ptd_test
          POSTGRES_DB: ptd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ptd -d ptd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ptd:ptd_test@127.0.0.1:5432/ptd_test?schema=public
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-32-bytes
      PTD_WEB_ORIGIN: http://localhost:5173
      PTD_ALLOWED_EMAILS: owner-a@example.com,owner-b@example.com
      GITHUB_CLIENT_ID: ci-placeholder
      GITHUB_CLIENT_SECRET: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build core dependency
        run: pnpm --filter @ptd/core build
      - name: Validate and deploy PostgreSQL migration
        run: |
          pnpm --filter server prisma:validate
          pnpm --filter server prisma:migrate:deploy
          pnpm --filter server prisma:generate
      - name: Check and test Server
        run: |
          pnpm --filter server lint
          pnpm --filter server typecheck
          pnpm --filter server test
          pnpm --filter server build

  publish-web-image:
    name: Publish web image
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
